<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css">
    <title>لوحة تحكم QR CAFFE</title>
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <header class="admin-header"><div><span class="eyebrow">QR CAFFE / BRAND STUDIO</span><h1>لوحة تحكم المطعم</h1><p>خصص صفحة العميل واحفظ الهوية البصرية في ثوانٍ.</p></div><a class="preview-link" href="/client/" target="_blank">معاينة الصفحة ↗</a></header>
      <div class="admin-grid">
        <section class="panel form-panel"><div class="panel-title"><span class="step">01</span><div><h2>بيانات المطعم</h2><p>المعلومات التي تظهر للزائر.</p></div></div>
          <label>اسم المطعم<input id="nameInput" value="Jackx Cafe"></label><label>الوصف القصير<input id="taglineInput" value="coffee's got a new address"></label>
          <label>اللوجو<input id="logoInput" type="file" accept="image/*"><small>ارفع PNG أو JPG، وتظهر المعاينة فوراً.</small></label>
          <div class="field-row"><label>لون أساسي<input id="accentInput" type="color" value="#f05a28"></label><label>لون الخلفية<input id="bgInput" type="color" value="#f9eadb"></label></div>
          <div class="field-row"><label>لون النص<input id="textInput" type="color" value="#4b2017"></label><label>لون البطاقات<input id="cardInput" type="color" value="#fff8f0"></label></div>
          <label>نوع الخط<select id="fontInput"><option value="Cairo">Cairo</option><option value="Tajawal">Tajawal</option><option value="Arial">Arial</option><option value="Georgia">Georgia</option></select></label>
          <div class="field-row"><label>حجم الخط<select id="sizeInput"><option value="16px">متوسط</option><option value="18px">كبير</option><option value="20px">كبير جداً</option></select></label><label>ستايل البطاقات<select id="radiusInput"><option value="999px">مستدير</option><option value="18px">ناعم</option><option value="8px">مربع</option></select></label></div>
          <button id="saveBtn" class="primary-button">حفظ التخصيص</button><span id="saveMessage" class="save-message" aria-live="polite"></span>
        </section>
        <section class="panel preview-panel"><div class="panel-title"><span class="step">02</span><div><h2>المعاينة المباشرة</h2><p>كل تعديل يظهر هنا قبل الحفظ.</p></div></div><div class="preview-frame"><iframe id="previewFrame" title="معاينة صفحة العميل" src="/client/"></iframe></div></section>
      </div>
      <section class="panel links-panel"><div class="panel-title"><span class="step">03</span><div><h2>روابط الصفحة</h2><p>أضف أهم الإجراءات التي يحتاجها عميلك.</p></div></div><div id="linksEditor" class="links-editor"></div><button id="addLink" class="secondary-button">+ إضافة رابط</button></section>
    </div>
    <script src="/app.js"></script><script>QR.initAdmin()</script>
  </body>
</html>
